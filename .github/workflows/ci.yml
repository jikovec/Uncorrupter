name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Core tests without optional tools
        env:
          UNCORRUPTER_DISABLE_EXTERNAL_TOOLS: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider
      - name: Capability and documentation consistency
        run: python -m pytest -p no:cacheprovider tests/test_capabilities.py
      - name: Build package
        run: python -m build

  ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests with FFmpeg
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -p no:cacheprovider
