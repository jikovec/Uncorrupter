[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-uncorrupter"
version = "0.3.0"
description = "Offline-first corrupted media recovery framework with evidence tracking, deep JPEG repair, and baseline video salvage."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "OpenAI"}]
dependencies = [
  "Pillow>=10.0.0",
]

[project.scripts]
file-uncorrupter = "file_uncorrupter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
